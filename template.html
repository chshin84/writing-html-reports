<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>문서 제목</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* BEGIN report-base (build.py가 채운다. 손으로 고치지 않는다) */
/* 보고서 규격 기준 CSS — 각 HTML의 <style> 맨 앞에 그대로 붙여 넣는다.
   규칙의 근거와 금지 목록은 같은 폴더의 보고서-규격.md에 있다. */
:root{
  --paper:#FFFFFF; --ink:#111418; --ink-2:#3F4650; --ink-3:#6B7280;
  --rule:#111418; --hair:#D6D9DE; --tint:#F4F4F1;
  --accent:#1F3A5F; --accent-2:#8FA3BC; --neg:#A8322A;
  --s1:#1F3A5F; --s2:#5E8C7E; --s3:#B07A2A; --s4:#8A8F98;
  --sans:"Pretendard Variable",Pretendard,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"D2Coding",Consolas,ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#15171A; --ink:#E9EBEE; --ink-2:#BCC2CA; --ink-3:#8D949E;
    --rule:#E9EBEE; --hair:#343941; --tint:#1D2024;
    --accent:#9DB7D8; --accent-2:#4B5E78; --neg:#E0776C;
    --s1:#9DB7D8; --s2:#86B5A6; --s3:#D6A45A; --s4:#8D949E;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#15171A; --ink:#E9EBEE; --ink-2:#BCC2CA; --ink-3:#8D949E;
  --rule:#E9EBEE; --hair:#343941; --tint:#1D2024;
  --accent:#9DB7D8; --accent-2:#4B5E78; --neg:#E0776C;
  --s1:#9DB7D8; --s2:#86B5A6; --s3:#D6A45A; --s4:#8D949E;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.75 var(--sans);
  font-variant-numeric:tabular-nums;word-break:keep-all;padding:48px 16px 72px}
.doc{max-width:880px;margin:0 auto}
p{margin:0 0 .9em}
p:last-child{margin-bottom:0}
b,strong{font-weight:600}
a{color:var(--accent);text-underline-offset:2px}
code,.code{font-family:var(--mono);font-size:.88em;color:var(--ink-2)}

/* 머리말: 소속·날짜 한 줄, 제목, 리드, 이중 괘선 */
.doc-head{padding-bottom:8px}
.doc-meta{font-size:13px;color:var(--ink-3);margin:0 0 10px}
h1{font-size:30px;line-height:1.3;font-weight:700;margin:0 0 14px;letter-spacing:-.01em}
.lede{font-size:17px;color:var(--ink-2);max-width:68ch;margin:0}

/* 절: 카드 없이 괘선과 여백으로 구분 */
section{margin-top:56px}
h2{font-size:21px;line-height:1.4;font-weight:700;margin:0 0 16px}
h3{font-size:16px;line-height:1.5;font-weight:600;margin:28px 0 8px}
.prose{max-width:68ch;color:var(--ink)}
.note,.cap{font-size:13px;line-height:1.6;color:var(--ink-3)}

/* 핵심 수치: 타일 대신 괘선 사이의 한 줄 표 */
.keyfig{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));border-top:1px solid var(--rule);border-bottom:1px solid var(--hair);margin:24px 0 0}
.keyfig{grid-template-rows:auto auto auto}
.keyfig>div{padding:12px 16px 12px 0;display:grid;grid-row:span 3;grid-template-rows:subgrid;row-gap:0;align-content:start}
.keyfig>div+div{padding-left:16px;border-left:1px solid var(--hair)}
.keyfig .k{display:block;font-size:13px;line-height:1.5;color:var(--ink-3);padding-bottom:4px}
.keyfig .v{display:block;font-size:18px;font-weight:600;line-height:1.4;color:var(--ink)}
.keyfig .d{display:block;font-size:13px;color:var(--ink-2)}

/* 요지: 문서당 한 번. 옅은 바탕 하나만 허용하고 색 띠는 쓰지 않는다 */
.gist{background:var(--tint);padding:20px 24px;margin-top:32px}
.gist h2{font-size:17px;margin-bottom:8px}
.gist ul{margin:0;padding-left:1.2em}
.gist li+li{margin-top:4px}

/* 주석성 문단: 굵은 머리말로 구분하고 상자를 쓰지 않는다 */
.aside{margin:16px 0;padding-top:10px;border-top:1px solid var(--hair);font-size:15px;color:var(--ink-2)}
.aside>b:first-child{color:var(--ink)}
.aside.warn>b:first-child{color:var(--neg)}

/* 표: 위아래 괘선만 쓰는 형식 */
.tbl{overflow-x:auto;margin:12px 0}
table{border-collapse:collapse;width:100%;font-size:14.5px;line-height:1.55}
caption{caption-side:top;text-align:left;font-weight:600;font-size:15px;padding-bottom:6px;color:var(--ink)}
thead th{font-size:13px;font-weight:600;color:var(--ink-2);text-align:left;padding:8px 12px 6px 0;border-top:1.5px solid var(--rule);border-bottom:1px solid var(--rule);vertical-align:bottom}
td{padding:8px 12px 8px 0;border-bottom:1px solid var(--hair);vertical-align:top}
tbody tr:last-child td{border-bottom:1.5px solid var(--rule)}
table:has(tfoot) tbody tr:last-child td{border-bottom:1px solid var(--rule)}
tfoot td{font-weight:600;border-bottom:1.5px solid var(--rule)}
th.n,td.n{text-align:right;white-space:nowrap}
th:last-child,td:last-child{padding-right:0}
tr.pick td{font-weight:600}
tr.pick td:first-child{box-shadow:none}

/* 도표: 제목(메시지), 단위·기간, 본체, 자료 출처 순서 */
figure{margin:24px 0}
figcaption .t{display:block;font-weight:600;font-size:15px}
figcaption .u{display:block;font-size:13px;color:var(--ink-3)}
.src{font-size:12.5px;color:var(--ink-3);margin-top:8px}
svg text{font-family:var(--sans);fill:var(--ink)}

/* 가로 막대 */
.bars{display:grid;gap:8px;margin-top:12px}
.brow{display:grid;grid-template-columns:minmax(150px,240px) 1fr 52px;gap:12px;align-items:center;font-size:14px}
.brow .l{color:var(--ink-2)}
.brow .l b{color:var(--ink)}
.track{position:relative;height:12px}
.fill{position:absolute;left:0;top:0;height:12px;background:var(--accent-2);width:var(--w)}
.fill.pick{background:var(--accent)}
.ref{position:absolute;top:-5px;bottom:-5px;width:0;border-left:1px dashed var(--ink-3)}
.brow .n{text-align:right;font-weight:600}

/* 시각화: 차트 상자, Mermaid 도식, 동작 예시. 규칙은 SKILL.md '시각화' 절에 있다 */
.viz{height:320px;margin-top:12px}
.viz-fail{display:flex;align-items:center;font-size:13px;color:var(--ink-3);border:1px solid var(--hair);padding:0 12px;min-height:48px}
pre.mermaid{margin:12px 0 0;font:inherit;font-size:13px;white-space:pre;overflow-x:auto;color:var(--ink-3)}
pre.mermaid.rendered{white-space:normal;text-align:center;color:var(--ink)}
pre.mermaid rect{rx:0;ry:0}
.demo-ctl{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-top:10px;font-size:13px;color:var(--ink-3)}
.demo-ctl button{font:inherit;font-size:13px;background:var(--paper);color:var(--ink);border:1px solid var(--hair);padding:3px 12px;cursor:pointer}
.demo-ctl button:disabled{color:var(--ink-3);cursor:default}
.demo-ctl .cnt{min-width:3.5em;color:var(--ink-2)}
.demo-cap{font-size:14.5px;color:var(--ink-2);margin:6px 0 0}
.demo-steps{display:none;font-size:13px;color:var(--ink-2);margin:8px 0 0;padding-left:1.4em}
.demo-static .demo-ctl,.demo-static .demo-cap{display:none}
.demo-static .demo-steps{display:block}

/* 번호 목록 형태의 단계 */
.steps{list-style:none;margin:0;padding:0;counter-reset:st}
.steps>li{counter-increment:st;display:grid;grid-template-columns:2.2em 1fr;gap:0 8px;padding:14px 0;border-bottom:1px solid var(--hair)}
.steps>li::before{content:counter(st) ".";font-weight:600;color:var(--ink-3)}

/* 정의 목록 */
.gloss{display:grid;grid-template-columns:1fr 1fr;gap:0 32px;margin:0}
.gloss>div{padding:10px 0;border-top:1px solid var(--hair)}
.gloss dt{font-weight:600}
.gloss dd{margin:2px 0 0;color:var(--ink-2);font-size:14.5px}

/* 페이지형 문서: <main class="doc paged">. 한 페이지씩 넘겨 보고, 인쇄하면 페이지마다 나뉜다 */
.pager{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;border-bottom:1px solid var(--hair);padding:0 0 10px;margin:0 0 8px;font-size:13px;color:var(--ink-3)}
.pager button{font:inherit;font-size:13px;background:var(--paper);color:var(--ink);border:1px solid var(--hair);padding:3px 12px;cursor:pointer}
.pager button:disabled{color:var(--ink-3);cursor:default}
.pager .cnt{min-width:4.5em;color:var(--ink-2)}
.toc{font-size:13px;line-height:1.9;color:var(--ink-3);margin:0 0 8px}
.toc a{color:var(--ink-2);text-decoration:none}
.toc a.on{color:var(--accent);font-weight:600;text-decoration:underline}
.page{margin-top:32px}
.js .page{display:none}
.js .page.on{display:block}
.pno{font-size:12.5px;color:var(--ink-3);margin:0 0 6px}
.paged .lede,.paged .prose{max-width:none}
.page td:first-child{white-space:nowrap}
.nw{white-space:nowrap}

/* 페이지 안의 블록: 요점 목록, 블록 머리(근거·중요 포인트·유의사항·출처) */
.pts{margin:0 0 6px;padding-left:1.2em;max-width:none}
.pts li+li{margin-top:4px}
.pts li>b:first-child{color:var(--ink)}
.page>h2+ul.pts{margin-bottom:8px}
.blk{margin:28px 0 6px;font-size:16px}
.blk.warn b{color:var(--neg)}
.src-list{font-size:13px;color:var(--ink-2)}
.src-list a{word-break:break-all}

footer{margin-top:64px;border-top:1px solid var(--rule);padding-top:12px;font-size:13px;color:var(--ink-3)}
footer p{margin:0 0 4px}

@media (max-width:760px){
  body{padding-top:32px}
  h1{font-size:25px}
  .keyfig>div+div{border-left:none;padding-left:0}
  .keyfig>div{border-bottom:1px solid var(--hair)}
  .gloss{grid-template-columns:1fr}
  .brow{grid-template-columns:110px 1fr 44px;font-size:13px}
}
@media print{
  .js .page{display:block}
  .pager,.toc{display:none}
  .page{break-before:page}
  @page{size:A4;margin:16mm 14mm}
  body{padding:0;font-size:10.5pt}
  section,figure,table,.gist{break-inside:avoid}
  h2,h3{break-after:avoid}
  a{color:inherit;text-decoration:none}
  .demo-ctl,.demo-cap{display:none}
  .demo-steps{display:block}
  .viz{height:auto}
  .viz>div{width:100%!important}
  pre.mermaid svg{width:100%;max-width:100%;height:auto}
}
/* END report-base */
/* 이 문서 전용: 토큰(var(--…))만 쓴다 */
</style>
<script src="https://cdn.jsdelivr.net/npm/echarts@6.1.0/dist/echarts.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@11.17.2/dist/mermaid.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<script>
/* BEGIN report-charts echarts@6.1.0 mermaid@11.17.2 gsap@3.15.0 (build.py가 채운다. 손으로 고치지 않는다) */
/* report-charts for echarts@6.1.0 mermaid@11.17.2 gsap@3.15.0
   보고서 시각화 연결 코드. build.py가 문서의 BEGIN/END report-charts 사이에 채운다. 원본은 이 파일이고, 문서 안에서 고치지 않는다.
   함수: RC.chart(상자, 옵션), RC.color(토큰 이름), RC.ma(값 배열, n), RC.demo(figure, 단계 배열),
   RC.icon(무대 svg, 아이콘 이름, x, y), RC.note(무대 svg, 폭, 높이), RC.fx(동작 예시 효과 묶음). 규칙은 SKILL.md '시각화' 절에 있다. */
(function () {
  var root = document.documentElement;
  var FAIL = '시각화를 불러오지 못했습니다';
  var PRINT_W = 688; // A4 본문 폭(210mm - 좌우 여백 28mm)의 px 값
  var RC = window.RC = {};

  function tok(name) { return getComputedStyle(root).getPropertyValue('--' + name).trim(); }
  function fail(box) { box.textContent = FAIL; box.classList.add('viz-fail'); }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  RC.color = function (name) {
    var v = tok(name);
    if (!v) console.error('RC.color: 없는 토큰 이름 ' + name);
    return v;
  };

  RC.ma = function (values, n) {
    var out = [], sum = 0;
    for (var i = 0; i < values.length; i++) {
      sum += values[i];
      if (i >= n) sum -= values[i - n];
      out.push(i >= n - 1 ? Math.round(sum / n * 1e8) / 1e8 : null);
    }
    return out;
  };

  /* 차트 */
  var themed = false, charts = [];
  function registerTheme() {
    if (themed) return;
    themed = true;
    var ink = tok('ink'), ink3 = tok('ink-3'), hair = tok('hair'), rule = tok('rule');
    var axis = { axisLine: { lineStyle: { color: rule } }, axisTick: { lineStyle: { color: rule } },
      axisLabel: { color: ink3 }, splitLine: { show: false } };
    echarts.registerTheme('report', {
      color: [tok('s1'), tok('s2'), tok('s3'), tok('s4'), tok('accent-2')],
      backgroundColor: 'transparent',
      textStyle: { fontFamily: tok('sans'), color: ink },
      categoryAxis: axis, timeAxis: axis,
      valueAxis: { axisLine: { show: false }, axisTick: { show: false }, axisLabel: { color: ink3 },
        splitLine: { lineStyle: { color: hair } } },
      legend: { textStyle: { color: ink3 }, icon: 'rect', itemWidth: 12, itemHeight: 8 },
      tooltip: { backgroundColor: tok('paper'), borderColor: hair, borderWidth: 1, textStyle: { color: ink },
        extraCssText: 'box-shadow:none;border-radius:0' },
      line: { symbol: 'none', lineStyle: { width: 1.5 } },
      bar: { itemStyle: { borderRadius: 0 } },
      pie: { itemStyle: { borderColor: tok('paper'), borderWidth: 1 } },
      candlestick: { itemStyle: { color: tok('neg'), color0: tok('s1'), borderColor: tok('neg'), borderColor0: tok('s1') } }
    });
  }
  RC.chart = function (box, option) {
    if (!box) { console.error('RC.chart: 차트 상자가 없다'); return null; }
    if (typeof echarts === 'undefined') { fail(box); return null; }
    try {
      registerTheme();
      var w = box.clientWidth || document.querySelector('main.doc').clientWidth; // 숨은 페이지는 폭이 0이다
      var h = box.clientHeight || parseFloat(getComputedStyle(box).height) || 320;
      var chart = echarts.init(box, 'report', { renderer: 'svg', width: w, height: h });
      option.animation = false;
      if (!option.tooltip) {
        var pie = (option.series || []).some(function (s) { return s.type === 'pie'; });
        option.tooltip = { trigger: pie ? 'item' : 'axis' };
      }
      chart.setOption(option);
    } catch (e) { // 차트 하나의 오류가 뒤의 시각화를 막지 않게 한다
      console.error('RC.chart', e);
      if (chart) chart.dispose();
      fail(box);
      return null;
    }
    charts.push({ chart: chart, box: box, h: h });
    new ResizeObserver(function () {
      if (box.clientWidth > 0 && box.clientWidth !== chart.getWidth()) chart.resize({ width: box.clientWidth, height: h });
    }).observe(box);
    return chart;
  };
  addEventListener('beforeprint', function () {
    charts.forEach(function (it) { it.chart.resize({ width: PRINT_W, height: it.h }); });
  });
  addEventListener('afterprint', function () {
    charts.forEach(function (it) {
      if (it.box.clientWidth > 0) it.chart.resize({ width: it.box.clientWidth, height: it.h });
    });
  });

  /* 도식. mermaid는 스크립트가 실행되자마자(DOMContentLoaded 전에) startOnLoad를 꺼야 한다.
     그러지 않으면 mermaid.min.js 자신의 기본 자동 실행이 .mermaid 요소를 먼저 렌더링해
     pre.textContent를 SVG로 바꿔버리고, 이어지는 renderMermaid()가 그 SVG 텍스트를 다시
     mermaid에 넣어 파싱에 실패한다. */
  if (typeof mermaid !== 'undefined') {
    mermaid.initialize({
      startOnLoad: false, theme: 'base', securityLevel: 'strict', fontFamily: tok('sans'),
      flowchart: { curve: 'linear' },
      themeVariables: {
        fontFamily: tok('sans'), fontSize: '14px', background: tok('paper'), textColor: tok('ink'),
        primaryColor: tok('paper'), primaryTextColor: tok('ink'), primaryBorderColor: tok('ink'),
        secondaryColor: tok('tint'), tertiaryColor: tok('paper'), lineColor: tok('ink-2'),
        clusterBkg: tok('paper'), clusterBorder: tok('hair'), edgeLabelBackground: tok('paper'),
        actorBkg: tok('paper'), actorBorder: tok('ink'), actorTextColor: tok('ink'), actorLineColor: tok('hair'),
        signalColor: tok('ink'), signalTextColor: tok('ink'),
        noteBkgColor: tok('tint'), noteBorderColor: tok('hair'), noteTextColor: tok('ink')
      }
    });
  }
  function renderMermaid() {
    var pres = [].slice.call(document.querySelectorAll('pre.mermaid'));
    if (!pres.length) return null;
    if (typeof mermaid === 'undefined') { pres.forEach(fail); return null; }
    return pres.reduce(function (p, pre, i) {
      var src = pre.textContent;
      return p.then(function () { return mermaid.render('rc-mermaid-' + i, src); })
        .then(function (r) { pre.innerHTML = r.svg; pre.classList.add('rendered'); }, function () { fail(pre); });
    }, Promise.resolve());
  }
  RC.ready = new Promise(function (res) {
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', res); else res();
  }).then(function () { return document.fonts ? document.fonts.ready : null; }).then(renderMermaid);

  /* 동작 예시 아이콘: 1px 선으로 그린 상태 표시. (x, y)는 아이콘 중심이고, 처음에는 투명하다 */
  var SVGNS = 'http://www.w3.org/2000/svg';
  function sv(tag, attrs, parent) {
    var e = document.createElementNS(SVGNS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }
  function glyph(g, x, y, ch, size) {
    var t = sv('text', { x: x, y: y + size * 0.35, 'text-anchor': 'middle', 'font-size': size, 'font-weight': 600, stroke: 'none' }, g);
    t.textContent = ch;
  }
  var ICONS = {
    person: function (g, x, y) { // 졸라맨: 높이 40, 폭 18
      sv('circle', { cx: x, cy: y - 14, r: 6 }, g);
      sv('path', { d: 'M' + x + ' ' + (y - 8) + 'V' + (y + 8) + 'M' + (x - 9) + ' ' + (y - 2) + 'H' + (x + 9) +
        'M' + (x - 7) + ' ' + (y + 20) + 'L' + x + ' ' + (y + 8) + 'L' + (x + 7) + ' ' + (y + 20) }, g);
    },
    question: function (g, x, y) { glyph(g, x, y, '?', 20); },
    check: function (g, x, y) {
      sv('circle', { cx: x, cy: y, r: 11 }, g);
      sv('path', { d: 'M' + (x - 5) + ' ' + y + 'L' + (x - 1) + ' ' + (y + 4) + 'L' + (x + 6) + ' ' + (y - 4) }, g);
    },
    cross: function (g, x, y) {
      sv('circle', { cx: x, cy: y, r: 11 }, g);
      sv('path', { d: 'M' + (x - 4) + ' ' + (y - 4) + 'L' + (x + 4) + ' ' + (y + 4) + 'M' + (x + 4) + ' ' + (y - 4) + 'L' + (x - 4) + ' ' + (y + 4) }, g);
    },
    doc: function (g, x, y) {
      sv('rect', { x: x - 8, y: y - 11, width: 16, height: 22 }, g);
      sv('path', { d: 'M' + (x - 4) + ' ' + (y - 5) + 'H' + (x + 4) + 'M' + (x - 4) + ' ' + y + 'H' + (x + 4) + 'M' + (x - 4) + ' ' + (y + 5) + 'H' + (x + 1) }, g);
    },
    coin: function (g, x, y) { sv('circle', { cx: x, cy: y, r: 10 }, g); glyph(g, x, y, '₩', 11); }
  };
  var ICON_COLOR = { question: 'accent', check: 'accent', cross: 'neg' };
  RC.icon = function (svg, name, x, y) {
    if (!svg || !ICONS[name]) { console.error('RC.icon: 무대가 없거나 없는 아이콘 이름 ' + name); return null; }
    var c = tok(ICON_COLOR[name] || 'ink');
    var g = sv('g', { 'class': 'rc-icon', fill: 'none', stroke: c, 'stroke-width': 1, opacity: 0 }, svg);
    ICONS[name](g, x, y);
    [].forEach.call(g.querySelectorAll('text'), function (t) { t.style.fill = c; }); // svg text의 기본 글자색 규칙보다 앞서게 한다
    return g;
  };

  /* 동작 예시 설명 상자: 발췌 문장을 연출 중인 도형 옆에 두어 시선이 무대 안에 머물게 한다.
     돌려주는 값 { g: 상자, t: 문장 칸, n: 숫자 칸 }. 위치는 RC.fx.say가 단계마다 옮긴다 */
  RC.note = function (svg, w, h) {
    if (!svg) { console.error('RC.note: 무대가 없다'); return null; }
    var g = sv('g', { 'class': 'rc-note', opacity: 0 }, svg);
    sv('rect', { x: 0, y: 0, width: w, height: h, fill: tok('paper'), stroke: tok('hair') }, g);
    var fo = sv('foreignObject', { x: 0, y: 0, width: w, height: h }, g);
    var div = document.createElement('div');
    div.style.cssText = 'padding:6px 8px;font:12.5px/1.45 var(--sans);color:var(--ink);word-break:keep-all';
    var t = document.createElement('span'), n = document.createElement('b');
    n.style.cssText = 'color:var(--accent);font-weight:600';
    div.appendChild(t); div.appendChild(document.createTextNode(' ')); div.appendChild(n);
    fo.appendChild(div);
    return { g: g, t: t, n: n };
  };

  /* 동작 예시 효과: play(tl, $) 안에서 RC.fx.이름(tl, …)으로 부른다. 단계 하나의 연출은 2초 안팎으로 맞춘다.
     at은 GSAP 위치 인자(생략하면 앞 효과 뒤, '<'이면 앞 효과와 함께)다 */
  function len(e) { return e && e.getTotalLength ? e.getTotalLength() : 0; }
  var shown = typeof WeakMap === 'function' ? new WeakMap() : null; // 글자 요소마다 직전 단계에서 보인 문장
  function textTween(tl, e, from, render, dur, at) { // 되감을 때 직전 단계의 문장으로 돌아가게 한다
    var prev = shown && shown.has(e) ? shown.get(e) : e.textContent, p = { v: 0 };
    if (shown) shown.set(e, render(1));
    return tl.to(p, { v: 1, duration: dur, ease: 'none',
      onUpdate: function () { e.textContent = p.v === 0 ? prev : render(p.v); } }, at);
  }
  RC.fx = {
    mark: function (tl, e, color, at) {
      return tl.to(e, { stroke: tok(color || 'accent'), strokeWidth: 2, duration: 0.3 }, at);
    },
    unmark: function (tl, els, at) { return tl.set(els, { stroke: tok('ink'), strokeWidth: 1 }, at); },
    draw: function (tl, line, dur, at) { // 선이 그려지며 나타난다
      var L = len(line);
      gsap.set(line, { strokeDasharray: L, strokeDashoffset: L });
      return tl.to(line, { strokeDashoffset: 0, duration: dur || 0.5, ease: 'none' }, at);
    },
    undraw: function (tl, lines, at) {
      [].concat(lines).forEach(function (l) { tl.set(l, { strokeDashoffset: len(l) }, at); });
      return tl;
    },
    follow: function (tl, dot, path, dur, at) { // 표식이 선을 따라 이동한다
      var L = len(path), n = 12, frames = [];
      for (var i = 1; i <= n; i++) {
        var pt = path.getPointAtLength(L * i / n);
        frames.push({ attr: { cx: pt.x, cy: pt.y } });
      }
      return tl.to(dot, { keyframes: frames, duration: dur || 0.6, ease: 'power1.inOut' }, at);
    },
    pop: function (tl, e, at) { // 살짝 튀어나오며 등장한다
      gsap.set(e, { opacity: 0, scale: 0.3, transformOrigin: '50% 50%' });
      return tl.to(e, { opacity: 1, scale: 1, duration: 0.35, ease: 'back.out(2.2)' }, at);
    },
    hide: function (tl, els, at) { return tl.set(els, { opacity: 0, scale: 0.3, transformOrigin: '50% 50%' }, at); },
    think: function (tl, person, question, at) { // 고개를 갸웃하고 물음표가 깜빡인다(약 0.8초)
      tl.to(person, { rotation: -8, transformOrigin: '50% 100%', duration: 0.2, yoyo: true, repeat: 3 }, at);
      return tl.to(question, { y: -4, duration: 0.2, yoyo: true, repeat: 3 }, '<');
    },
    shake: function (tl, e, at) { return tl.to(e, { x: 5, duration: 0.06, yoyo: true, repeat: 5 }, at); },
    type: function (tl, e, text, dur, at) { // 문장이 타이핑되듯 나타난다. dur 0이면 바로 바뀐다
      return textTween(tl, e, '', function (v) { return text.slice(0, Math.ceil(text.length * v)); },
        dur == null ? Math.min(1, text.length * 0.03) : dur, at);
    },
    say: function (tl, note, x, y, text, dur, at) { // 설명 상자를 (x, y)로 옮기고 문장을 타이핑한다. 숫자 칸은 비운다
      tl.set(note.g, { x: x, y: y, opacity: 1 }, at);
      RC.fx.type(tl, note.n, '', 0, '<');
      return RC.fx.type(tl, note.t, text, dur, '<');
    },
    count: function (tl, e, from, to, suffix, dur, at) { // 숫자가 올라가며 표시된다
      return textTween(tl, e, '', function (v) { return Math.round(from + (to - from) * v).toLocaleString('ko-KR') + (suffix || ''); },
        dur == null ? 0.7 : dur, at);
    }
  };

  /* 동작 예시 */
  RC.demo = function (fig, steps) {
    if (!fig) { console.error('RC.demo: figure가 없다'); return null; }
    if (!Array.isArray(steps) || !steps.length) { console.error('RC.demo: 단계 배열이 없다'); return null; }
    fig.classList.add('demo');
    var ctl = el('div', 'demo-ctl'), cap = el('p', 'demo-cap'), list = el('ol', 'demo-steps');
    var bPrev = el('button', null, '이전'), bPlay = el('button', null, '재생'),
        bNext = el('button', null, '다음'), bReset = el('button', null, '처음부터'), cnt = el('span', 'cnt');
    [bPrev, bPlay, bNext, bReset].forEach(function (b) { b.type = 'button'; ctl.appendChild(b); });
    ctl.appendChild(cnt);
    steps.forEach(function (s) {
      var li = el('li');
      li.appendChild(el('b', null, s.name));
      li.appendChild(document.createTextNode(' ' + s.text));
      list.appendChild(li);
    });
    var src = fig.querySelector('.src');
    [ctl, cap, list].forEach(function (n) { fig.insertBefore(n, src); });
    if (typeof gsap === 'undefined') { fig.classList.add('demo-static'); return null; }

    RC.ready.then(function () {
      var $ = function (name) {
        var hit = fig.querySelector('[id="' + name + '"]');
        if (hit) return hit;
        var re = new RegExp('-flowchart-' + name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '-\\d+$');
        var nodes = fig.querySelectorAll('g.node');
        for (var i = 0; i < nodes.length; i++) {
          if (re.test(nodes[i].id)) return nodes[i].querySelector('rect, polygon, path') || nodes[i];
        }
        return null;
      };
      var tl = gsap.timeline({ paused: true }), ends = [];
      try {
        steps.forEach(function (s, i) { s.play(tl, $); tl.addLabel('e' + i); ends.push(tl.duration()); });
      } catch (e) { // 단계 코드가 틀리면 동작하지 않는 버튼 대신 단계 설명 목록을 보인다
        console.error('RC.demo', e);
        tl.kill();
        fig.classList.add('demo-static');
        return;
      }
      var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
      var cur = 0, tw = null, timer = null, saved = 0, last = steps.length - 1;

      function show(i) {
        cur = i;
        cnt.textContent = (i + 1) + '/' + steps.length;
        cap.textContent = steps[i].name + ': ' + steps[i].text;
        bPrev.disabled = i === 0;
        bNext.disabled = i === last;
      }
      function stop() {
        tl.pause();
        if (tw) { tw.kill(); tw = null; }
        if (timer) { timer.kill(); timer = null; }
        bPlay.textContent = '재생';
      }
      function go(i, animate) {
        stop();
        if (animate && !reduce) { // 직전 단계로 바로 옮긴 뒤 한 단계만 연출한다(빠르게 여러 번 눌러도 2초 안팎)
          if (i > 0) tl.seek('e' + (i - 1), false);
          tw = tl.tweenTo('e' + i, { onComplete: function () { tw = null; } });
        }
        else tl.seek('e' + i, false);
        show(i);
      }
      function tick() {
        if (cur < last) { tl.seek('e' + (cur + 1), false); show(cur + 1); timer = gsap.delayedCall(1.2, tick); } else stop();
      }
      function play() {
        if (cur === last) go(0, false);
        bPlay.textContent = '일시정지';
        if (reduce) timer = gsap.delayedCall(1.2, tick); else tl.play();
      }
      // seek의 두 번째 인자 false: 바로 이동할 때도 글자 효과(onUpdate)가 끝 상태를 그리게 한다
      tl.eventCallback('onUpdate', function () { // 연속 재생 중에만 단계 표시를 따라가게 한다
        if (tw) return;
        var t = tl.time(), i = 0;
        while (i < last && ends[i] < t - 1e-6) i++;
        if (i !== cur) show(i);
      });
      tl.eventCallback('onComplete', function () { bPlay.textContent = '재생'; });
      bPrev.onclick = function () { go(Math.max(0, cur - 1), false); };
      bNext.onclick = function () { go(Math.min(last, cur + 1), true); };
      bReset.onclick = function () { go(0, false); };
      bPlay.onclick = function () { if (tl.isActive() || tw || timer) stop(); else play(); };
      new ResizeObserver(function () { if (fig.clientWidth === 0) stop(); }).observe(fig); // 다른 페이지로 넘기면 멈춘다
      addEventListener('beforeprint', function () { saved = cur; stop(); tl.seek('e' + last, false); });
      addEventListener('afterprint', function () { go(saved, false); });
      go(0, false);
    });
    return null;
  };
})();
/* END report-charts */
</script>
</head>
<body>
<main class="doc">

<header class="doc-head">
  <p class="doc-meta">소속 · 2026년 9월</p>
  <h1>문서 제목</h1>
  <p class="lede">이 문서가 무엇을 했고 무엇을 알아냈는지 두세 문장으로 적습니다.</p>
  <div class="keyfig">
    <div><span class="k">수치 이름</span><span class="v">0.85 → 1.11</span><span class="d">단위나 설명</span></div>
    <div><span class="k">수치 이름</span><span class="v">0.62</span><span class="d">단위나 설명</span></div>
  </div>
</header>

<div class="gist">
  <h2>요약</h2>
  <ul>
    <li>결론을 문장으로 적습니다.</li>
  </ul>
</div>

<section>
  <h2>절 제목</h2>
  <p class="prose">절의 결론을 첫 문장에 적습니다.</p>
  <figure>
    <figcaption><span class="t">도표 제목</span><span class="u">기간, 단위</span></figcaption>
    <div class="bars">
      <div class="brow"><span class="l">항목</span><span class="track"><span class="fill" style="--w:48%"></span></span><span class="n">0.77</span></div>
      <div class="brow"><span class="l"><b>강조 항목</b></span><span class="track"><span class="fill pick" style="--w:86%"></span></span><span class="n">1.38</span></div>
    </div>
    <p class="src">자료: 출처를 적습니다.</p>
  </figure>
  <div class="tbl"><table>
    <caption>표 제목</caption>
    <thead><tr><th>항목</th><th class="n">값</th></tr></thead>
    <tbody><tr><td>항목 설명</td><td class="n">1.00</td></tr></tbody>
  </table></div>
  <p class="aside"><b>주의사항.</b> 경고 문단은 굵은 머리말로 시작합니다.</p>
  <figure>
    <figcaption><span class="t">월별 거래대금 (2026년 1~6월)</span><span class="u">단위: 조원, 선은 3개월 이동평균</span></figcaption>
    <div class="viz" id="c-trend"></div>
    <p class="src">자료: 출처를 적습니다.</p>
  </figure>
  <figure>
    <figcaption><span class="t">주문 처리 흐름</span><span class="u">접수에서 정산까지</span></figcaption>
    <pre class="mermaid">flowchart LR
  A[주문 접수] --> B{금액 &lt; 한도}
  B -->|통과| C[체결]
  B -->|초과| X[거부]
  C --> D[정산]</pre>
    <p class="src">자료: 출처를 적습니다.</p>
  </figure>
  <figure id="d-flow">
    <figcaption><span class="t">주문 검증 과정 (동작 예시)</span><span class="u">버튼으로 단계를 넘깁니다</span></figcaption>
    <svg class="stage" viewBox="0 0 640 110" width="100%" role="img" aria-label="주문 검증 과정">
      <line x1="190" y1="55" x2="230" y2="55" stroke="currentColor"/>
      <line x1="410" y1="55" x2="450" y2="55" stroke="currentColor"/>
      <rect id="v1" x="10" y="33" width="180" height="44" fill="none" stroke="currentColor"/>
      <rect id="v2" x="230" y="33" width="180" height="44" fill="none" stroke="currentColor"/>
      <rect id="v3" x="450" y="33" width="180" height="44" fill="none" stroke="currentColor"/>
      <text x="100" y="60" text-anchor="middle" font-size="14">주문 접수</text>
      <text x="320" y="60" text-anchor="middle" font-size="14">한도 검증</text>
      <text x="540" y="60" text-anchor="middle" font-size="14">체결 전송</text>
      <circle id="dot" cx="100" cy="95" r="5" fill="currentColor" opacity="0"/>
    </svg>
    <p class="src">자료: 출처를 적습니다.</p>
  </figure>
</section>

<footer>
  <p>자료: 출처와 기준일을 적습니다.</p>
</footer>

</main>
<script>
var vol = [21.4, 23.1, 19.8, 25.6, 27.2, 24.9];
RC.chart(document.getElementById('c-trend'), {
  grid: { left: 40, right: 16, top: 32, bottom: 28 },
  legend: { top: 0, left: 0 },
  xAxis: { type: 'category', data: ['1월', '2월', '3월', '4월', '5월', '6월'] },
  yAxis: { type: 'value' },
  series: [
    { name: '거래대금', type: 'bar', barWidth: '50%', data: vol },
    { name: '3개월 이동평균', type: 'line', data: RC.ma(vol, 3) }
  ]
});
function mark(tl, target) { tl.to(target, { stroke: RC.color('accent'), strokeWidth: 2, duration: 0.4 }); }
RC.demo(document.getElementById('d-flow'), [
  { name: '주문 접수', text: '고객 주문이 접수 단계에 들어옵니다.',
    play: function (tl, $) { tl.set($('dot'), { opacity: 1, attr: { cx: 100 } }); mark(tl, $('v1')); } },
  { name: '한도 검증', text: '주문 금액을 고객 한도와 비교합니다.',
    play: function (tl, $) { tl.to($('dot'), { attr: { cx: 320 }, duration: 0.8 }); mark(tl, $('v2')); } },
  { name: '체결 전송', text: '검증을 통과한 주문을 거래소로 보냅니다.',
    play: function (tl, $) { tl.to($('dot'), { attr: { cx: 540 }, duration: 0.8 }); mark(tl, $('v3')); } }
]);
</script>
